services:

  postgres:
    image: postgres:15
    container_name: library_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: librarydb


    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
    container_name: library_backend
    ports:
      - "5000:5000"

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/librarydb

  frontend:
    build:
      context: ./Frontend
    container_name: library_frontend
    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
